<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEMETRIX // ANALYZER_PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { background-color: #050505; color: #16a34a; font-family: 'Courier New', Courier, monospace; }
        .crt-border { border: 1px solid #15803d; background: #000; box-shadow: 0 0 10px rgba(21, 128, 61, 0.3); }
        .crt-text { text-shadow: 0 0 6px rgba(34, 197, 94, 0.6); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        canvas { width: 100% !important; height: 380px !important; }
        .data-table { font-size: 0.8rem; }
    </style>
</head>
<body class="p-4 min-h-screen">
<div class="max-w-7xl mx-auto">
    <header class="crt-border p-6 mb-6">
        <h1 class="text-4xl font-black text-green-500 crt-text uppercase tracking-tighter">TELEMETRIX ANALYZER_PRO</h1>
        <p class="text-xs text-green-700 mt-1">// OFFLINE + ONLINE POST-PROCESSING ENGINE</p>
        
        <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-green-600 text-xs mb-1">UPLOAD LOG FILE (.json)</label>
                <input type="file" id="filePicker" accept=".json" 
                       class="w-full text-green-500 border border-green-800 p-3 bg-black cursor-pointer">
            </div>
            <div>
                <label class="block text-green-600 text-xs mb-1">OR PASTE JSON ARRAY / RECORD</label>
                <textarea id="jsonPaste" rows="3" placeholder='[{"uptime":..., ...}] or single record'
                          class="w-full bg-black border border-green-800 p-3 text-green-400 font-mono text-xs"></textarea>
                <button onclick="loadPastedJSON()" 
                        class="mt-2 px-6 py-2 bg-green-900 hover:bg-green-700 border border-green-500 text-green-300 text-sm">
                        PROCESS PASTED DATA
                </button>
            </div>
        </div>
    </header>

    <nav class="flex gap-2 mb-6 border-b border-green-900 pb-3 overflow-x-auto">
        <button onclick="showTab('tab-overview')" class="tab-btn active px-5 py-2 border border-green-700 hover:bg-green-900">OVERVIEW</button>
        <button onclick="showTab('tab-map')" class="tab-btn px-5 py-2 border border-green-700 hover:bg-green-900">MAP &amp; PATH</button>
        <button onclick="showTab('tab-kinetics')" class="tab-btn px-5 py-2 border border-green-700 hover:bg-green-900">KINETICS</button>
        <button onclick="showTab('tab-thermo')" class="tab-btn px-5 py-2 border border-green-700 hover:bg-green-900">THERMODYNAMICS</button>
        <button onclick="showTab('tab-geo')" class="tab-btn px-5 py-2 border border-green-700 hover:bg-green-900">GEODESICS</button>
        <button onclick="showTab('tab-raw')" class="tab-btn px-5 py-2 border border-green-700 hover:bg-green-900">RAW DATA</button>
    </nav>

    <!-- OVERVIEW -->
    <div id="tab-overview" class="tab-content active space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="statsGrid"></div>
        <div class="crt-border p-4"><canvas id="chartSummary"></canvas></div>
    </div>

    <!-- MAP -->
    <div id="tab-map" class="tab-content">
        <div id="map" class="crt-border h-[550px] w-full"></div>
        <div class="mt-4 text-xs text-green-600">Path colored by speed (green → red)</div>
    </div>

    <!-- KINETICS -->
    <div id="tab-kinetics" class="tab-content space-y-6">
        <div class="crt-border p-4"><canvas id="chartSpeed"></canvas></div>
        <div class="crt-border p-4"><canvas id="chartJerk"></canvas></div>
    </div>

    <!-- THERMODYNAMICS -->
    <div id="tab-thermo" class="tab-content space-y-6">
        <div class="crt-border p-4"><canvas id="chartThermo"></canvas></div>
        <div class="crt-border p-4"><canvas id="chartHumidity"></canvas></div>
    </div>

    <!-- GEODESICS -->
    <div id="tab-geo" class="tab-content space-y-6">
        <div class="crt-border p-4"><canvas id="chartAltitude"></canvas></div>
        <div class="crt-border p-4"><canvas id="chartIncline"></canvas></div>
    </div>

    <!-- RAW DATA -->
    <div id="tab-raw" class="tab-content">
        <div class="crt-border overflow-auto max-h-[70vh]">
            <table class="data-table w-full" id="rawTable">
                <thead><tr class="bg-green-950"><th class="p-2 text-left">Uptime</th><th>LAT</th><th>LNG</th><th>Speed</th><th>Temp</th><th>Hum</th><th>Press</th><th>BaroAlt</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ============== MATH HELPERS ==============
function calcDewPoint(T, RH) {
    const a = 17.27, b = 237.7;
    let alpha = ((a * T) / (b + T)) + Math.log(RH / 100);
    return (b * alpha) / (a - alpha);
}

function calcVaporPressure(T, RH) { return 6.11 * Math.pow(10, (7.5 * T) / (237.3 + T)) * (RH / 100); }
function calcAbsoluteHumidity(T, RH) {
    let e = calcVaporPressure(T, RH);
    return (e * 100) / (461.5 * (T + 273.15)) * 1000;
}

function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ============== GLOBALS ==============
let map, polyline, globalData = [];

// ============== FILE / PASTE HANDLERS ==============
document.getElementById('filePicker').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const parsed = JSON.parse(ev.target.result);
            processData(Array.isArray(parsed) ? parsed : [parsed]);
        } catch(err) { alert("Invalid JSON"); }
    };
    reader.readAsText(file);
});

function loadPastedJSON() {
    const text = document.getElementById('jsonPaste').value.trim();
    if (!text) return alert("Paste JSON first");
    try {
        const parsed = JSON.parse(text);
        processData(Array.isArray(parsed) ? parsed : [parsed]);
    } catch(err) { alert("Invalid JSON"); }
}

// ============== MAIN PROCESSING ==============
function processData(data) {
    globalData = data;

    // Enrich data with derived metrics
    data.forEach((r, i) => {
        if (!r.temp || isNaN(r.temp)) r.temp = 0;
        if (!r.hum || isNaN(r.hum)) r.hum = 0;
        if (!r.press) r.press = 1013.25;

        r.dewPoint = calcDewPoint(r.temp, r.hum);
        r.vaporPress = calcVaporPressure(r.temp, r.hum);
        r.absHum = calcAbsoluteHumidity(r.temp, r.hum);
        r.airDensity = (r.press * 100) / (287.05 * (r.temp + 273.15));

        if (i > 0) {
            const prev = data[i-1];
            const dt = (r.uptime - prev.uptime) || 1;
            const dist = haversine(prev.lat || 0, prev.lng || 0, r.lat || 0, r.lng || 0);
            
            r.distDelta = dist;
            r.incline = dist > 5 ? ((r.baroAlt - prev.baroAlt) / dist) * 100 : 0;
            r.jerk = (r.speed - (prev.speed || 0)) / dt;
        } else {
            r.distDelta = 0;
            r.incline = 0;
            r.jerk = 0;
        }
    });

    updateAllVisuals(data);
}

// ============== UPDATE ALL UI ==============
function updateAllVisuals(data) {
    updateStats(data);
    updateMap(data);
    updateCharts(data);
    updateRawTable(data);
    showTab('tab-overview');
}

function updateStats(data) {
    const totalDist = data.reduce((sum, r, i) => {
        return i > 0 ? sum + (r.distDelta || 0) : sum;
    }, 0) / 1000;

    const avgSpeed = data.reduce((a, b) => a + (b.speed || 0), 0) / data.length;
    const maxTemp = Math.max(...data.map(r => r.temp || 0));
    const avgHum = data.reduce((a, b) => a + (b.hum || 0), 0) / data.length;

    const html = `
        <div class="crt-border p-5"><div class="text-green-600 text-xs">TOTAL DISTANCE</div><div class="text-4xl font-bold">${totalDist.toFixed(2)} km</div></div>
        <div class="crt-border p-5"><div class="text-green-600 text-xs">AVG SPEED</div><div class="text-4xl font-bold">${avgSpeed.toFixed(1)} km/h</div></div>
        <div class="crt-border p-5"><div class="text-green-600 text-xs">MAX TEMP</div><div class="text-4xl font-bold">${maxTemp.toFixed(1)} °C</div></div>
        <div class="crt-border p-5"><div class="text-green-600 text-xs">AVG HUMIDITY</div><div class="text-4xl font-bold">${avgHum.toFixed(1)} %</div></div>
    `;
    document.getElementById('statsGrid').innerHTML = html;
}

function updateMap(data) {
    if (!map) {
        map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        polyline = L.polyline([], {color: '#22c55e', weight: 4}).addTo(map);
    }

    const points = [];
    data.forEach(r => {
        if (r.lat && r.lat !== 0 && r.lng && r.lng !== 0) {
            points.push([r.lat, r.lng]);
        }
    });

    polyline.setLatLngs(points);
    if (points.length > 0) map.fitBounds(points, {padding: [30, 30]});
}

function updateCharts(data) {
    const uptimeLabels = data.map(r => `T+${r.uptime}s`);

    // Summary chart
    new Chart(document.getElementById('chartSummary'), {
        type: 'line',
        data: {
            labels: uptimeLabels,
            datasets: [
                { label: 'Speed (km/h)', data: data.map(r => r.speed), borderColor: '#22c55e', tension: 0.2 },
                { label: 'Temperature (°C)', data: data.map(r => r.temp), borderColor: '#eab308', tension: 0.2 }
            ]
        },
        options: { responsive: true, plugins: { legend: { display: true } } }
    });

    // Speed
    new Chart(document.getElementById('chartSpeed'), {
        type: 'line',
        data: { labels: uptimeLabels, datasets: [{ label: 'Speed', data: data.map(r => r.speed), borderColor: '#22c55e' }] },
        options: { responsive: true }
    });

    // Jerk
    new Chart(document.getElementById('chartJerk'), {
        type: 'line',
        data: { labels: uptimeLabels, datasets: [{ label: 'Jerk', data: data.map(r => r.jerk), borderColor: '#ef4444' }] },
        options: { responsive: true }
    });

    // Thermo
    new Chart(document.getElementById('chartThermo'), {
        type: 'line',
        data: {
            labels: uptimeLabels,
            datasets: [
                { label: 'Temp °C', data: data.map(r => r.temp), borderColor: '#eab308' },
                { label: 'Dew Point', data: data.map(r => r.dewPoint), borderColor: '#3b82f6' }
            ]
        },
        options: { responsive: true }
    });

    // Humidity
    new Chart(document.getElementById('chartHumidity'), {
        type: 'line',
        data: {
            labels: uptimeLabels,
            datasets: [
                { label: 'Humidity %', data: data.map(r => r.hum), borderColor: '#8b5cf6' },
                { label: 'Abs Hum g/m³', data: data.map(r => r.absHum), borderColor: '#ec4899' }
            ]
        },
        options: { responsive: true }
    });

    // Altitude & Incline
    new Chart(document.getElementById('chartAltitude'), {
        type: 'line',
        data: { labels: uptimeLabels, datasets: [{ label: 'Baro Altitude (m)', data: data.map(r => r.baroAlt), borderColor: '#14b8a6' }] },
        options: { responsive: true }
    });

    new Chart(document.getElementById('chartIncline'), {
        type: 'line',
        data: { labels: uptimeLabels, datasets: [{ label: 'Incline %', data: data.map(r => r.incline), borderColor: '#f97316' }] },
        options: { responsive: true }
    });
}

function updateRawTable(data) {
    const tbody = document.querySelector('#rawTable tbody');
    tbody.innerHTML = '';
    data.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-green-900 hover:bg-green-950";
        tr.innerHTML = `
            <td class="p-2">${r.uptime}</td>
            <td class="p-2">${r.lat?.toFixed(6) || 0}</td>
            <td class="p-2">${r.lng?.toFixed(6) || 0}</td>
            <td class="p-2">${r.speed?.toFixed(1) || 0}</td>
            <td class="p-2">${r.temp?.toFixed(2) || 0}</td>
            <td class="p-2">${r.hum?.toFixed(1) || 0}</td>
            <td class="p-2">${r.press?.toFixed(2) || 0}</td>
            <td class="p-2">${r.baroAlt?.toFixed(1) || 0}</td>
        `;
        tbody.appendChild(tr);
    });
}

function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'bg-green-900'));
    const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => 
        btn.getAttribute('onclick').includes(tabId)
    );
    if (activeBtn) activeBtn.classList.add('active', 'bg-green-900');
}

// Auto-load example if needed
// processData([ {uptime:288, fix:0, lat:0, lng:0, speed:0, temp:26.26, hum:50.44, press:994.38, baroAlt:158.33, ble:"AP_LIVE"} ]);
</script>
</body>
</html>
